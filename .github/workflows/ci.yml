name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/spbstu-mcp

      # Store a test credential with each platform's own tool and read it back.
      - name: Credential store (macOS)
        if: runner.os == 'macOS'
        run: |
          security add-generic-password -s spbstu-mcp-test -a ivanov.ii@edu.spbstu.ru -T /usr/bin/security -w 'Пароль-123'
          STORE_TEST=1 go test ./internal/keychain -run TestStoreRoundTrip -v
      - name: Credential store (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gnome-keyring libsecret-tools dbus-x11
          dbus-run-session -- sh -c '
            echo -n "ci-keyring" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            printf "Пароль-123" | secret-tool store --label=spbstu-mcp-test service spbstu-mcp-test account ivanov.ii@edu.spbstu.ru
            STORE_TEST=1 go test ./internal/keychain -run TestStoreRoundTrip -v'
      - name: Credential store (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmdkey /generic:spbstu-mcp-test /user:ivanov.ii@edu.spbstu.ru /pass:Пароль-123
          $env:STORE_TEST = "1"
          go test ./internal/keychain -run TestStoreRoundTrip -v
