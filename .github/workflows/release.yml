name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/} bin=spbstu-mcp
            [ "$os" = windows ] && bin=spbstu-mcp.exe
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/$bin" ./cmd/spbstu-mcp
            name="spbstu-mcp_${GITHUB_REF_NAME}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd dist && zip -q "$name.zip" "$bin")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$bin"
            fi
            rm "dist/$bin"
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          [ -n "$TAP_DEPLOY_KEY" ] || { echo "no TAP_DEPLOY_KEY, skipping"; exit 0; }
          mkdir -p ~/.ssh && printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q git@github.com:kad-xyz/homebrew-tap.git tap
          scripts/formula.sh "$GITHUB_REF_NAME" dist/checksums.txt > tap/Formula/spbstu-mcp.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "feat: spbstu-mcp ${GITHUB_REF_NAME#v}" && git push -q
